<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI技能コーチ{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <a href="/" class="brand">AI技能コーチ</a>
    {% if login_enabled %}<a href="/logout" class="muted small">ログアウト</a>{% endif %}
  </header>
  {% if not login_enabled %}
  <div class="notice">パスワード未設定：同じ Wi-Fi の誰でも開ける状態です。現場で使う前に .env の APP_PASSWORD を設定してください。</div>
  {% endif %}
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
