{# 分類を選ぶだけ。分類の名前と色は管理者メニューで登録・変更する。sel＝選んでおくid #}
<select name="folder_id" class="folder-pick">
  <option value="" {% if not sel %}selected{% endif %}>分類なし</option>
  {% for fo in folders %}<option value="{{ fo.id }}" {% if fo.id == sel %}selected{% endif %}>{{ fo.name }}</option>{% endfor %}
</select>
{% if request.state.user and request.state.user.role == 'admin' %}<a class="muted" href="/admin#folders">分類を足す・色を変える（管理者メニュー）</a>{% endif %}
