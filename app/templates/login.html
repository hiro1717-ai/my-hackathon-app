{% extends "base.html" %}
{% block title %}ログイン - AI技能コーチ{% endblock %}
{% block content %}
<h1>ログイン</h1>
<p class="lead">配られたIDとパスワードを入れてください。一度入れると30日間は聞きません。</p>
<form method="post" action="/login" class="card">
  <input type="hidden" name="next" value="{{ next }}">
  <label>ログインID
    <input type="text" name="login_id" required autofocus autocomplete="username" autocapitalize="off">
  </label>
  <label>パスワード
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  {% if error %}<p class="error">IDかパスワードが違います。</p>{% endif %}
  <button type="submit" class="primary big">入る</button>
</form>
{% endblock %}
